name: Refresh Equity Price Targets

on:
  schedule:
    - cron: "35 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - run: python build_workbook.py data.json Equity_Price_Targets.xlsx
      - run: python write_csv.py
      - name: Commit updated files
        run: |
          git config user.name "price-target-bot"
          git config user.email "actions@github.com"
          git add data.json data.csv Equity_Price_Targets.xlsx
          git diff --cached --quiet || git commit -m "Auto-refresh $(date -u +%F)"
          git push
